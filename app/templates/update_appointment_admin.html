<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posodobi pregled - Admin</title>
    <link rel="stylesheet" href="../static/style.css">
    <link rel="stylesheet" href="../static/home.css">
</head>
<body>

    <nav class="navbar">
        <a href="{{ url_for('main.admin_dashboard') }}" class="home-btn">🏠</a>
        <div class="nav-right">
            <div class="nav-links">
                <a href="/appointment_admin">Pregledi</a>
                <a href="/user_admin">Uporabniki</a>
                <a href="/department_admin">Oddelki</a>
                <a href="/patient_admin">Pacienti</a>
                <a href="/staff_admin">Zaposleni</a>
                <a href="/room_admin">Sobe</a>
                <a href="/bed_admin">Postelje</a>    
                <a href="/admission_admin">Sprejemi</a>
                <a href="/diagnosis_admin">Diagnoze</a>
            </div>
            <a href="{{ url_for('auth.logout') }}" class="logout-btn">Odjava</a>
        </div>
    </nav>

    <div class="content">
        <h1>Posodobi pregled</h1>

        <div class="data-container">
            <form method="POST" style="max-width: 600px; margin: 0 auto;">
                <div style="margin-bottom: 20px;">
                    <label for="doctor_id" style="display: block; margin-bottom: 5px; font-weight: bold;">Doctor:</label>
                    <select name="doctor_id" id="doctor_id" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                        {% for doctor in doctors %}
                        <option value="{{ doctor.staff_id }}" {% if doctor.staff_id == appointment.staff_id %}selected{% endif %}>
                            {{ doctor.user.name }} (ID: {{ doctor.staff_id }})
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div style="margin-bottom: 20px;">
                    <label for="patient_id" style="display: block; margin-bottom: 5px; font-weight: bold;">Pacient:</label>
                    <select name="patient_id" id="patient_id" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                        {% for patient in patients %}
                        <option value="{{ patient.patient_id }}" {% if patient.patient_id == appointment.patient_id %}selected{% endif %}>
                            {{ patient.user.name }} (ID: {{ patient.patient_id }})
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div style="margin-bottom: 20px;">
                    <label for="appointment_date" style="display: block; margin-bottom: 5px; font-weight: bold;">Datum:</label>
                    <input type="date" name="appointment_date" id="appointment_date" value="{{ appointment.appointment_date }}" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                </div>

                <div style="margin-bottom: 20px;">
                    <label for="appointment_time" style="display: block; margin-bottom: 5px; font-weight: bold;">Ura:</label>
                    <input type="time" name="appointment_time" id="appointment_time" value="{{ appointment.appointment_time.strftime('%H:%M') }}" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                </div>

                <div style="margin-bottom: 20px;">
                    <label for="status" style="display: block; margin-bottom: 5px; font-weight: bold;">Status:</label>
                    <select name="status" id="status" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                        <option value="scheduled" {% if appointment.status == 'scheduled' %}selected{% endif %}>Načrtovan</option>
                        <option value="canceled" {% if appointment.status == 'canceled' %}selected{% endif %}>Preklican</option>
                        <option value="completed" {% if appointment.status == 'completed' %}selected{% endif %}>Zaključen</option>
                    </select>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="submit" style="flex: 1; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Posodobi pregled</button>
                    <a href="{{ url_for('main.appointment_admin') }}" style="flex: 1; padding: 10px; background-color: #6c757d; color: white; text-align: center; text-decoration: none; border-radius: 4px;">Prekliči</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
