<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posodobi sobo - Admin</title>
    <link rel="stylesheet" href="../static/style.css">
    <link rel="stylesheet" href="../static/home.css">
</head>
<body>

    <nav class="navbar">
        <a href="{{ url_for('main.admin_dashboard') }}" class="home-btn">🏠</a>
        <div class="nav-right">
            <div class="nav-links">
                <a href="/appointment_admin">Pregledi</a>
                <a href="/user_admin">Uporabniki</a>
                <a href="/department_admin">Oddelki</a>
                <a href="/patient_admin">Pacienti</a>
                <a href="/staff_admin">Zaposleni</a>
                <a href="/room_admin">Sobe</a>
                <a href="/bed_admin">Postelje</a>    
                <a href="/admission_admin">Sprejemi</a>
                <a href="/diagnosis_admin">Diagnoze</a>
            </div>
            <a href="{{ url_for('auth.logout') }}" class="logout-btn">Odjava</a>
        </div>
    </nav>

    <div class="content">
        <h1>Posodobi sobo</h1>

        <div class="data-container">
            <form method="POST" style="max-width: 600px; margin: 0 auto;">

                
                <div style="margin-bottom: 20px;">
                    <label for="room_type" style="display: block; margin-bottom: 5px; font-weight: bold;">Tip:</label>
                    <input type="text" name="room_type" id="room_type" value="{{ room.type }}" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                </div>

                <div style="margin-bottom: 20px;">
                    <label for="department_id" style="display: block; margin-bottom: 5px; font-weight: bold;">Oddelek:</label>
                    <select name="department_id" id="department_id" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                        {% for department in departments %}
                        <option value="{{ department.department_id }}" {% if department.department_id == room.department_id %}selected{% endif %}>
                            {{ department.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="submit" style="flex: 1; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Posodobi sobo</button>
                    <a href="{{ url_for('main.room_admin') }}" style="flex: 1; padding: 10px; background-color: #6c757d; color: white; text-align: center; text-decoration: none; border-radius: 4px;">Prekliči</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
