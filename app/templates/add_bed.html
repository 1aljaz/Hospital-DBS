<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodaj posteljo - Admin</title>
    <link rel="stylesheet" href="../static/style.css">
    <link rel="stylesheet" href="../static/home.css">
</head>
<body>

    <nav class="navbar">
        <a href="{{ url_for('main.admin_dashboard') }}" class="home-btn">🏠</a>
        <div class="nav-right">
            <div class="nav-links">
                <a href="/appointment_admin">Pregledi</a>
                <a href="/user_admin">Uporabniki</a>
                <a href="/department_admin">Oddelki</a>
                <a href="/patient_admin">Pacienti</a>
                <a href="/staff_admin">Zaposleni</a>
                <a href="/room_admin">Sobe</a>
                <a href="/bed_admin">Postelje</a>    
                <a href="/admission_admin">Sprejemi</a>
                <a href="/diagnosis_admin">Diagnoze</a>
            </div>
            <a href="{{ url_for('auth.logout') }}" class="logout-btn">Odjava</a>
        </div>
    </nav>

    <div class="content">
        <h1>Dodaj novo posteljo</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div style="padding: 10px; margin-bottom: 20px; border-radius: 4px; background-color: {% if category == 'success' %}#d4edda{% elif category == 'danger' %}#f8d7da{% else %}#d1ecf1{% endif %}; color: {% if category == 'success' %}#155724{% elif category == 'danger' %}#721c24{% else %}#0c5460{% endif %};">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="data-container">
            <form method="POST" style="max-width: 600px; margin: 0 auto;">

                <div style="margin-bottom: 20px;">
                    <label for="room_id"
                        style="display: block; margin-bottom: 5px; font-weight: bold;">Soba:</label>
                    <select name="room_id" id="room_id" required
                        style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                        <option value="">Izberite sobo</option>
                        {% for room in rooms %}
                        <option value="{{ room.room_id }}">
                            {{ room.type }} - {{ room.department.name}} (ID: {{ room.room_id }})
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div style="margin-bottom: 20px;">
                    <label for="bed_status" style="display: block; margin-bottom: 5px; font-weight: bold;">Status:</label>
                    <select name="bed_status" id="bed_status" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                        <option value="free">Free</option>
                        <option value="occupied">Occupied</option>
                    </select>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="submit" style="flex: 1; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Dodaj posteljo</button>
                    <a href="{{ url_for('main.bed_admin') }}" style="flex: 1; padding: 10px; background-color: #6c757d; color: white; text-align: center; text-decoration: none; border-radius: 4px;">Prekliči</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
